[project]
name = "chongming"
version = "0.0.0"
description = "Architecture skeleton for a multi-camera airborne-target research system"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.13",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chongming"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["chongming"]
