[project]
name = "chongming"
version = "0.0.0"
description = "Architecture skeleton for a multi-camera airborne-target research system"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.1,<3",
    "opencv-python-headless>=4.10,<5",
    "pillow>=11,<13",
    "shapely>=2.1,<3",
]

[project.scripts]
chongming-preview = "chongming.preview:main"
chongming-scene = "chongming.scenarios.run:main"
chongming-center = "chongming.development:main"
chongming-osm = "chongming.scenarios.osm:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "ruff>=0.8",
    "types-shapely>=2.1,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src/chongming/",
    "/tests/",
    "/scripts/",
    "/scenarios/",
    "/docs/",
    "/背景资料/",
    "/*.md",
    "/.editorconfig",
    "/.gitignore",
    "/flake.nix",
    "/flake.lock",
    "/uv.lock",
    "/pyproject.toml",
    "/treefmt.toml",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chongming"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["chongming"]

[tool.uv]
exclude-newer = "3 days ago"
