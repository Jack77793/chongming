tree-root-file = "flake.nix"

# Do not traverse generated environments, caches, or experiment outputs.
excludes = [
  ".git/**",
  ".venv/**",
  "venv/**",
  "env/**",
  "__pycache__/**",
  "**/__pycache__/**",
  ".godot/**",
  "**/.godot/**",
  ".mypy_cache/**",
  ".pytest_cache/**",
  ".ruff_cache/**",
  ".codex-cache/**",
  "build/**",
  "dist/**",
  "logs/**",
  "tmp/**",
  "temp/**",
  "output/**",
  "results/**",
  "result",
  "result-*/**",
  # Dependency locks are source inputs, not formatter inputs.
  "flake.lock",
  "uv.lock",
  "package-lock.json",
  "**/package-lock.json",
  "npm-shrinkwrap.json",
  "**/npm-shrinkwrap.json",
]

[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]

[formatter.python]
command = "ruff"
options = ["format"]
includes = ["*.py"]

[formatter.prettier]
command = "prettier"
options = ["--write"]
includes = ["*.json", "*.html", "*.js", "*.mjs", "*.cjs", "*.css", "*.md", "*.markdown", "*.yml", "*.yaml"]
